[package]
name = "hydradb-storage-core"
version = "0.1.0"
edition = "2021"
description = "HydraDB disaggregated storage layer engine in Rust compiled to WASM"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
